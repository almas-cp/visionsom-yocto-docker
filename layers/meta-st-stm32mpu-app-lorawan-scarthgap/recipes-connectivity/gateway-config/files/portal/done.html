<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuration Complete</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      padding: 24px 16px;
    }
    .wrap {
      max-width: 520px;
      margin: 50px auto;
    }
    .card {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      text-align: center;
    }
    .logo {
      display: block;
      margin: 0 auto 22px;
      width: 72%;
      max-width: 220px;
      height: auto;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: #e6f4ea;
      color: #1e7e34;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 12px;
      color: #4b5563;
      font-size: 1rem;
      line-height: 1.6;
    }
    .small {
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="/sidebarLogo.png" alt="OneSense logo" class="logo">
      <div class="icon">✓</div>
      <h1>Configuration Complete</h1>
      <p>Thank you. Gateway configuration is done.</p>
      <p>Your gateway is rebooting and will be ready to use shortly.</p>
      <p class="small">You can now close this page and reconnect to the gateway after it finishes restarting.</p>
    </div>
  </div>
</body>
</html>
