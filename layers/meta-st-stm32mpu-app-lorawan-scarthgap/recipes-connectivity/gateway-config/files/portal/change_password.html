<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Credentials</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      padding: 24px 16px;
    }
    .wrap {
      max-width: 460px;
      margin: 40px auto;
    }
    .card {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      display: block;
      margin: 0 auto;
      width: 72%;
      max-width: 220px;
      height: auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }
    p {
      margin: 0 0 18px;
      color: #6b7280;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 0.92rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 76px;
    }
    .toggle-text-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #1a73e8;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    button.save-btn {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1rem;
      cursor: pointer;
      background: #1a73e8;
      color: #fff;
    }
    button.save-btn:disabled {
      background: #9bbcf0;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      display: none;
      white-space: pre-line;
    }
    .ok { background: #e6f4ea; color: #1e7e34; }
    .err { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo-wrap">
        <img src="/sidebarLogo.png" alt="OneSense logo" class="logo">
      </div>

      <h1>Set New Credentials</h1>
      <p>For security, change the default admin login before continuing.</p>

      <label for="new_username">New Username</label>
      <input type="text" id="new_username" autocomplete="username" placeholder="Enter new username">

      <label for="new_password">New Password</label>
      <div class="password-wrap">
        <input type="password" id="new_password" autocomplete="new-password" placeholder="Enter new password">
        <button type="button" class="toggle-text-btn" onclick="togglePassword('new_password', this)">Show</button>
      </div>

      <label for="confirm_password">Confirm New Password</label>
      <div class="password-wrap">
        <input type="password" id="confirm_password" autocomplete="new-password" placeholder="Re-enter new password">
        <button type="button" class="toggle-text-btn" onclick="togglePassword('confirm_password', this)">Show</button>
      </div>

      <button id="saveBtn" class="save-btn" type="button" onclick="changeCredentials()">Save New Credentials</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
  function showStatus(msg, ok) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (ok ? 'ok' : 'err');
    el.style.display = 'block';
  }

  function togglePassword(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') {
      el.type = 'text';
      btn.textContent = 'Hide';
    } else {
      el.type = 'password';
      btn.textContent = 'Show';
    }
  }

  function changeCredentials() {
    const username = document.getElementById('new_username').value.trim();
    const password = document.getElementById('new_password').value;
    const confirm = document.getElementById('confirm_password').value;
    const btn = document.getElementById('saveBtn');

    if (!username || !password || !confirm) {
      showStatus('Please complete all fields.', false);
      return;
    }

    if (username.length < 4) {
      showStatus('Username must be at least 4 characters.', false);
      return;
    }

    if (password.length < 8) {
      showStatus('Password must be at least 8 characters.', false);
      return;
    }

    if (password !== confirm) {
      showStatus('Passwords do not match.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    fetch('/change_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(async r => {
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.message || 'Failed to save credentials.');
      showStatus('Credentials updated successfully. Opening configuration...', true);

      setTimeout(() => {
        window.location.replace('/');
      }, 500);

      setTimeout(() => {
        window.location.href = '/';
      }, 1200);

      setTimeout(() => {
        window.location.assign('/index.html');
      }, 2200);
    })
    .catch(e => {
      showStatus(e.message || 'Failed to save credentials.', false);
      btn.disabled = false;
      btn.textContent = 'Save New Credentials';
    });
  }
</script>
</body>
</html>
