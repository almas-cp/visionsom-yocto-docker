# conf/layer.conf — meta-st-stm32mpu-app-lorawan (ported to scarthgap)

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "stm32mpu-app-lorawan"
BBFILE_PATTERN_stm32mpu-app-lorawan = "^${LAYERDIR}/"
BBFILE_PRIORITY_stm32mpu-app-lorawan = "9"

# Scarthgap compatibility (was: dunfell)
LAYERSERIES_COMPAT_stm32mpu-app-lorawan = "scarthgap"
LAYERDEPENDS_stm32mpu-app-lorawan = "core"

# Default userfs partition size (1GB) for 512MB swapfile and Docker
STM32MP_USERFS_SIZE ?= "1048576"
