# cellular-modem.cfg
# Kernel config fragment — 5G/LTE cellular modem support
#
# Modem 1: Telit FN990A28 (5G Sub-6 GHz) — USB interface
#   Interface modes: MBIM (primary), QMI, ECM/NCM
#   USB Vendor:Product: 1bc7:1060 (and variants)
#
# Modem 2: SIM7600 (4G LTE) — UART interface
#   NOTE: SIM7600 is a 4G LTE-A module, not 5G. It supports PPP over UART
#   for data connectivity and AT commands for control.
#
# ── USB subsystem (required for Telit FN990A28) ─────────────────────────────
# Base USB networking framework
CONFIG_USB_USBNET=y

# CDC NCM — high-speed USB network class (Telit ECM/NCM mode)
CONFIG_USB_NET_CDC_NCM=y

# MBIM — Mobile Broadband Interface Model (Telit primary mode)
# Requires USB WDM for /dev/cdc-wdmX control channel
CONFIG_USB_WDM=y
CONFIG_USB_NET_CDC_MBIM=y

# QMI WWAN — Qualcomm Modem Interface (alternative to MBIM)
CONFIG_USB_NET_QMI_WWAN=y

# USB Serial Option — creates ttyUSBx AT command ports
# Required for AT command access on both modems (if SIM7600 on USB-serial adapter)
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_OPTION=y

# USB ACM — CDC ACM (virtual serial over USB, some modem control ports use this)
CONFIG_USB_ACM=y

# ── PPP — Point-to-Point Protocol (SIM7600 UART data connection) ────────────
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_PPP_DEFLATE=y
CONFIG_PPP_BSDCOMP=y
CONFIG_PPP_MPPE=y
CONFIG_PPPOE=y

# ── Network routing support (needed for cellular routing) ───────────────────
# IP masquerading / NAT (if sharing cellular connection)
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y

# ── UART / tty (SIM7600 on native UART) ─────────────────────────────────────
# STM32MP UART is usually already enabled; these are safeguards:
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
