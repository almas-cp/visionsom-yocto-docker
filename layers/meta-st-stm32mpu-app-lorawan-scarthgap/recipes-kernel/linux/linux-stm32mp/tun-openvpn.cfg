# tun-openvpn.cfg
# Kernel config fragment — enables TUN/TAP device support for OpenVPN.
#
# CONFIG_TUN=y  → built directly into the kernel (vmlinux).
#   /dev/net/tun is always available at boot — no modprobe or autoload needed.
#   This also means kernel-module-tun does NOT need to be in IMAGE_INSTALL.
#
CONFIG_TUN=y
