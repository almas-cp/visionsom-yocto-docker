# /etc/chrony.conf — Optimized for embedded field gateways (VisionSOM-STM32MP1)
#
# Strategy:
#   1. Multiple stratum-1/2 NTP servers for resilience across GSM, Wi-Fi, Ethernet
#   2. makestep: allow large one-shot step corrections at startup to quickly
#      set the clock (rather than slowly slewing from 1970 to the correct date)
#   3. rtcsync: keep the kernel RTC in sync (useful if RTC is added later)
#   4. maxdistance: relaxed to allow sync via high-latency cellular links
#   5. minsources: use a single source if only cellular is available

# ── NTP Servers ──────────────────────────────────────────────────────────────
# Google Public NTP — supports leap-smearing, highly reliable
server time1.google.com iburst
server time2.google.com iburst
server time3.google.com iburst
server time4.google.com iburst

# Cloudflare NTP — good fallback
server time.cloudflare.com iburst

# NTP Pool — regional fallback (works even on low-quality cellular)
pool 0.pool.ntp.org iburst
pool 1.pool.ntp.org iburst

# ── Fast Initial Sync (KEY setting for embedded boards without RTC battery) ──
# Allow stepping the clock by any amount during the first 3 clock updates.
# This means: even if the clock is stuck at 1970, chrony will instantly
# snap it to the correct date on the very first NTP response.
# After the 3rd update, only slewing is allowed (no more big jumps).
makestep 1.0 3

# ── Drift Tracking ───────────────────────────────────────────────────────────
# Save clock drift to eMMC so chrony can compensate faster on next boot
driftfile /var/lib/chrony/drift

# ── Cellular / High-Latency Tolerance ────────────────────────────────────────
# Default maxdistance is 1.5s — too strict for GSM/LTE with jitter
maxdistance 16.0

# Only require 1 reachable source (instead of default 3)
# Critical for field devices that may only have 1 active link
minsources 1

# ── Security ─────────────────────────────────────────────────────────────────
# Only allow NTP queries from localhost (no NTP server functionality)
cmdallow 127.0.0.1

# ── Logging ──────────────────────────────────────────────────────────────────
logdir /var/log/chrony
log measurements statistics tracking
