# /etc/systemd/system/aziot-edged.service.d/10-fake-hwclock.conf
#
# Systemd drop-in: make aziot-edged wait for fake-hwclock to restore
# the saved clock before it starts. This prevents SSL certificate validation
# failures when the board boots with clock=1970 (no RTC battery).
#
# fake-hwclock.service runs very early in sysinit.target and sets the clock
# to the last saved timestamp (at worst a few hours old), which is close
# enough for Azure's certificates (valid for 1-2 years, not hours).
# chrony will then correct the clock precisely once network is available.

[Unit]
After=fake-hwclock.service
Requires=fake-hwclock.service
